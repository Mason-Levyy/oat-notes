[project]
name = "oat-notes"
version = "0.1.0"
description = "Live meeting transcription for Windows: WASAPI capture, Silero VAD chunking, faster-whisper."
readme = "README.md"
authors = [
    { name = "Mason Levy", email = "levyamason@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyaudiowpatch>=0.2.12",
    "numpy>=1.26",
    "pynput>=1.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
oat-notes = "oat_notes.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
