[project]
name = "oat-notes"
version = "0.4.0"
description = "Live meeting transcription for Windows: WASAPI capture, Silero VAD chunking, faster-whisper."
readme = "README.md"
authors = [
    { name = "Mason Levy", email = "levyamason@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyaudiowpatch>=0.2.12",
    "numpy>=1.26",
    "pynput>=1.8.2",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "truststore>=0.9",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PIE", "FURB",
    "PLC", "PLE", "PLW", "TRY", "S110", "BLE", "ISC", "C4", "PERF",
    "RET", "LOG", "G", "PGH", "FLY",
]
ignore = [
    "BLE001",
    "TRY003",
    "TRY300",
    "TRY400",
    "PLC0415",
    "SIM105",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/oat_notes/app.py" = ["SIM115"]
"src/oat_notes/settings.py" = ["TRY004"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["oat_notes.inject", "oat_notes.overlay", "oat_notes.single_instance"]
ignore_errors = true

[project.scripts]
oat-notes = "oat_notes.cli:main"

[project.optional-dependencies]
openvino = [
    "openvino-genai>=2026.2.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
