[project]
name = "oat-notes"
version = "0.2.0"
description = "Live meeting transcription for Windows: WASAPI capture, Silero VAD chunking, faster-whisper."
readme = "README.md"
authors = [
    { name = "Mason Levy", email = "levyamason@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyaudiowpatch>=0.2.12",
    "numpy>=1.26",
    "pynput>=1.8.2",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "truststore>=0.9",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8",
]

[project.scripts]
oat-notes = "oat_notes.cli:main"

[project.optional-dependencies]
openvino = [
    "openvino-genai>=2026.2.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
